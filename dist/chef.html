<!doctype html>
<html lang="id">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>RestoOrder | Layar Chef (Dapur)</title>
    <script>
      (() => {
        'use strict';
        const root = document.documentElement;
        const stored = (() => {
          try { return localStorage.getItem('lte-theme'); } catch { return null; }
        })();
        const resolved = stored === 'dark' || stored === 'light'
          ? stored
          : (globalThis.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        root.setAttribute('data-bs-theme', resolved);
        root.style.colorScheme = resolved;
        try {
          const u = JSON.parse(localStorage.getItem('restoran_auth_user') || 'null');
          if (!u || !['admin', 'kasir', 'chef'].includes(u.role)) {
            root.classList.add('auth-pending');
            globalThis.location.replace('./login.html');
          } else if (sessionStorage.getItem('restoran_welcome_splash') === '1') {
            root.classList.add('welcome-splash-active');
          }
        } catch {
          root.classList.add('auth-pending');
          globalThis.location.replace('./login.html');
        }
      })();
    </script>
    <style>html.auth-pending body{visibility:hidden}html.welcome-splash-active body>.app-wrapper{opacity:0!important}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <meta name="theme-color" content="#0d6efd" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/img/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/img/app-icon-192.png" />
    <link rel="preload" href="./css/adminlte.css" as="style" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.3.1/index.css"
      crossorigin="anonymous"
      media="print"
      onload="this.media = 'all'"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.17.0/styles/overlayscrollbars.min.css"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/adminlte.css" />
    <link rel="stylesheet" href="./css/restaurant.css" />
  </head>
  <body class="layout-fixed fixed-header sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
      <nav class="app-header navbar navbar-expand bg-body">
        <div class="container-fluid">
          <ul class="navbar-nav align-items-center">
            <li class="nav-item">
              <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button" aria-label="Alihkan bilah sisi">
                <i class="bi bi-list"></i>
              </a>
            </li>
            <li class="nav-item ms-1">
              <span class="badge text-bg-success">
                <i class="bi bi-broadcast me-1"></i><span class="d-none d-sm-inline">Sinkron </span>Real-Time
              </span>
            </li>
          </ul>
          <ul class="navbar-nav ms-auto align-items-center gap-1 gap-sm-2">
            <li class="nav-item form-check form-switch mb-0 me-1 d-flex align-items-center gap-1">
              <input class="form-check-input mt-0" type="checkbox" id="sound-toggle" checked aria-label="Suara notifikasi" />
              <label class="form-check-label small" for="sound-toggle">
                <i class="bi bi-volume-up"></i><span class="d-none d-sm-inline"> Suara</span>
              </label>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" data-lte-toggle="fullscreen" aria-label="Layar penuh" title="Layar penuh">
                <i data-lte-icon="maximize" class="bi bi-arrows-fullscreen"></i>
                <i data-lte-icon="minimize" class="bi bi-fullscreen-exit d-none"></i>
              </a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" aria-label="Ubah tema">
                <i class="bi bi-circle-half"></i>
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><button class="dropdown-item" type="button" data-bs-theme-value="light"><i class="bi bi-sun-fill me-2"></i>Terang</button></li>
                <li><button class="dropdown-item" type="button" data-bs-theme-value="dark"><i class="bi bi-moon-stars-fill me-2"></i>Gelap</button></li>
                <li><button class="dropdown-item" type="button" data-bs-theme-value="auto"><i class="bi bi-circle-half me-2"></i>Otomatis</button></li>
              </ul>
            </li>
            <li class="nav-item d-flex align-items-center gap-1 gap-sm-2 ps-2 border-start">
              <span id="nav-user-role" class="badge text-bg-secondary">-</span>
              <span id="nav-user-name" class="fw-semibold small d-none d-md-inline">-</span>
              <button id="btn-logout" type="button" class="btn btn-sm btn-outline-danger" aria-label="Keluar">
                <i class="bi bi-box-arrow-right"></i> <span class="d-none d-sm-inline">Keluar</span>
              </button>
            </li>
          </ul>
        </div>
      </nav>

      <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
        <div class="sidebar-brand">
          <a href="./chef.html" class="brand-link">
            <img src="./assets/img/app-icon.svg" alt="Logo RestoOrder" class="brand-image opacity-90 shadow rounded" />
            <span class="brand-text fw-light"><b>Resto</b>Order</span>
          </a>
        </div>
        <div class="sidebar-wrapper">
          <nav class="mt-2" aria-label="Navigasi restoran">
            <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" data-accordion="false" id="navigation"></ul>
          </nav>
        </div>
      </aside>

      <main class="app-main">
        <div class="app-content-header">
          <div class="container-fluid">
            <div class="row align-items-center g-2">
              <div class="col-12 col-md-5">
                <h1 class="mb-0 fs-3"><i class="bi bi-fire text-warning me-2"></i>Layar Chef (Dapur)</h1>
              </div>
              <div class="col-12 col-md-7 d-flex flex-wrap gap-1 gap-sm-2 justify-content-md-end">
                <span class="badge text-bg-warning fs-6 chef-stat-pill">Menunggu: <span id="cnt-pending">0</span></span>
                <span class="badge text-bg-primary fs-6 chef-stat-pill">Dimasak: <span id="cnt-cooking">0</span></span>
                <span class="badge text-bg-success fs-6 chef-stat-pill">Siap: <span id="cnt-ready">0</span></span>
                <span class="badge text-bg-danger fs-6 chef-stat-pill">Batal: <span id="cnt-cancelled">0</span></span>
              </div>
            </div>
          </div>
        </div>

        <div class="app-content">
          <div class="container-fluid">
            <div class="card mb-3">
              <div class="card-body p-2 p-sm-3 d-flex flex-column flex-md-row gap-2 justify-content-between align-items-stretch align-items-md-center">
                <div class="d-flex flex-wrap gap-1" role="group" aria-label="Filter status dapur">
                  <button type="button" class="btn btn-sm btn-primary chef-filter" data-filter="active">Aktif Dapur</button>
                  <button type="button" class="btn btn-sm btn-outline-primary chef-filter" data-filter="pending">Menunggu</button>
                  <button type="button" class="btn btn-sm btn-outline-primary chef-filter" data-filter="cooking">Dimasak</button>
                  <button type="button" class="btn btn-sm btn-outline-primary chef-filter" data-filter="ready">Siap</button>
                  <button type="button" class="btn btn-sm btn-outline-primary chef-filter" data-filter="cancelled">Dibatalkan</button>
                  <button type="button" class="btn btn-sm btn-outline-primary chef-filter" data-filter="all">Semua</button>
                </div>
                <div class="d-flex flex-wrap gap-1 align-items-center">
                  <select id="chef-section-filter" class="form-select form-select-sm w-auto" aria-label="Filter bagian dapur">
                    <option value="all">Semua Bagian</option>
                    <option value="food">Fokus Makanan</option>
                    <option value="drink">Fokus Minuman</option>
                  </select>
                  <select id="chef-service-filter" class="form-select form-select-sm w-auto" style="min-width: 150px;" aria-label="Filter tipe layanan">
                    <option value="all">Semua Layanan</option>
                    <option value="dine_in">Makan di Tempat</option>
                    <option value="take_away">Dibungkus</option>
                  </select>
                </div>
              </div>
            </div>

            <div id="chef-grid" class="chef-tickets-grid">
              <div class="text-center text-secondary py-5" style="grid-column: 1 / -1;">Menunggu pesanan masuk dari Kasir...</div>
            </div>
          </div>
        </div>
      </main>

      <footer class="app-footer">
        <div class="float-end d-none d-sm-inline">Kitchen Display System</div>
        <strong>RestoOrder</strong> — Pembaruan otomatis tanpa refresh halaman.
      </footer>
    </div>

    <div id="app-page-modals"></div>
    <nav id="mobile-bottom-nav" class="mobile-bottom-nav d-lg-none" aria-label="Navigasi cepat aplikasi"></nav>

    <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.17.0/browser/overlayscrollbars.browser.es6.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
    <script src="./js/adminlte.js"></script>
    <script type="module">
      import { initAppShell } from './js/app-router.js';
      void initAppShell({ pageId: 'chef', allowedRoles: ['admin', 'kasir', 'chef'] });
    </script>
  </body>
