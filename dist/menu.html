    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>RestoOrder | Kelola Daftar Menu</title>
    <script>
      (() => {
        'use strict';
        const root = document.documentElement;
        const stored = (() => {
          try { return localStorage.getItem('lte-theme'); } catch { return null; }
        })();
        const resolved = stored === 'dark' || stored === 'light'
          ? stored
          : (globalThis.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        root.setAttribute('data-bs-theme', resolved);
        root.style.colorScheme = resolved;
        try {
          const u = JSON.parse(localStorage.getItem('restoran_auth_user') || 'null');
          if (!u || !u.role) {
            root.classList.add('auth-pending');
            globalThis.location.replace('./login.html');
          } else if (u.role !== 'admin') {
            root.classList.add('auth-pending');
            globalThis.location.replace(u.role === 'chef' ? './chef.html' : './pesanan.html');
          }
        } catch {
          root.classList.add('auth-pending');
          globalThis.location.replace('./login.html');
        }
      })();
    </script>
    <style>html.auth-pending body{visibility:hidden}</style>

        <div class="app-content">

            <div class="card">
              <div class="card-header d-flex flex-column flex-sm-row gap-2 justify-content-between align-items-stretch align-items-sm-center">
                <div class="d-flex gap-2 align-items-center justify-content-between">
                  <select id="filter-cat" class="form-select form-select-sm" style="width: auto;">
                    <option value="all">Semua Kategori</option>
                    <option value="makanan">Makanan</option>
                    <option value="minuman">Minuman</option>
                  </select>
                  <span id="menu-count" class="small text-secondary">0 menu</span>
                </div>
                <input id="search-menu" type="search" class="form-control form-control-sm w-100 w-sm-auto" placeholder="Cari nama menu..." style="min-width: 190px; max-width: 280px;" />

                  </tbody>

              </div>

      <footer class="app-footer">

      </footer>
    </div>

    <div id="app-page-modals">
      <div class="modal fade" id="menuModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
          <form id="menu-form" class="modal-content">
            <div class="modal-header">
              <h5 id="menu-modal-title" class="modal-title">Tambah Menu</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label for="m-name" class="form-label">Nama Menu</label>
                <input id="m-name" type="text" class="form-control" required placeholder="Contoh: Nasi Uduk Komplit" />
              </div>
              <div class="row g-2 mb-3">
                <div class="col-md-6">
                  <label for="m-cat" class="form-label">Kategori</label>
                  <select id="m-cat" class="form-select">
                    <option value="makanan">Makanan</option>
                    <option value="minuman">Minuman</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="m-price" class="form-label">Harga (Rp)</label>
                  <input id="m-price" type="number" min="0" step="500" class="form-control" required value="15000" />
                </div>
              </div>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="m-avail" checked />
                <label class="form-check-label" for="m-avail">Menu Tersedia untuk Dipesan</label>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
