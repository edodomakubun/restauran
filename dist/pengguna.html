<!doctype html>

  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>RestoOrder | Kelola Akun Staf</title>
    <script>
      (() => {
        'use strict';
        const root = document.documentElement;
        const stored = (() => {
          try { return localStorage.getItem('lte-theme'); } catch { return null; }
        })();
        const resolved = stored === 'dark' || stored === 'light'
          ? stored
          : (globalThis.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        root.setAttribute('data-bs-theme', resolved);
        root.style.colorScheme = resolved;
        try {
          const u = JSON.parse(localStorage.getItem('restoran_auth_user') || 'null');
          if (!u || !u.role) {
            root.classList.add('auth-pending');
            globalThis.location.replace('./login.html');
          } else if (u.role !== 'admin') {
            root.classList.add('auth-pending');
            globalThis.location.replace(u.role === 'chef' ? './chef.html' : './pesanan.html');
          }
        } catch {
          root.classList.add('auth-pending');
          globalThis.location.replace('./login.html');
        }
      })();
    </script>
    <style>html.auth-pending body{visibility:hidden}</style>

    <meta name="theme-color" content="#0d6efd" />

                      <th>Nama Lengkap</th>

    <div id="app-page-modals">

          <form id="user-form" class="modal-content">
            <div class="modal-header">
              <h5 id="user-modal-title" class="modal-title">Buat Akun Staf</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label for="u-name" class="form-label">Nama Lengkap</label>
                <input id="u-name" type="text" class="form-control" required placeholder="Contoh: Rina Kasir 2" />
              </div>
              <div class="mb-3" id="u-email-wrap">
                <label for="u-email" class="form-label">Email Login</label>
                <input id="u-email" type="email" class="form-control" required placeholder="rina@restoran.local" />
              </div>
              <div class="mb-3">
                <label for="u-role" class="form-label">Peran (Hak Akses)</label>
                <select id="u-role" class="form-select">
                  <option value="kasir">Kasir</option>
                  <option value="chef">Chef</option>
                  <option value="admin">Admin</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="u-pass" class="form-label">Kata Sandi <span id="u-pass-hint" class="small text-secondary">(min. 6 karakter)</span></label>
                <input id="u-pass" type="password" class="form-control" minlength="6" placeholder="Minimal 6 karakter" />
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
              <button type="submit" class="btn btn-primary">Simpan Akun</button>
            </div>
          </form>
