<!doctype html>
<html lang="id">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Masuk | Dapur Laris Manis</title>
    <script>
      (() => {
        'use strict';
        const root = document.documentElement;
        const stored = (() => {
          try { return localStorage.getItem('lte-theme'); } catch { return null; }
        })();
        const resolved = stored === 'dark' || stored === 'light'
          ? stored
          : (globalThis.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        root.setAttribute('data-bs-theme', resolved);
        root.style.colorScheme = resolved;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <meta name="theme-color" content="#0d6efd" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/img/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/img/app-icon-192.png" />
    <link rel="preload" href="./css/adminlte.css" as="style" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.3.1/index.css"
      crossorigin="anonymous"
      media="print"
      onload="this.media = 'all'"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/adminlte.css" />
    <link rel="stylesheet" href="./css/restaurant.css" />
  </head>
  <body class="login-page">
    <!-- Floating tools: fullscreen + theme switcher -->
    <div class="login-floating-tools">
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary bg-body shadow-sm"
        data-lte-toggle="fullscreen"
        aria-label="Layar penuh"
        title="Layar penuh"
      >
        <i data-lte-icon="maximize" class="bi bi-arrows-fullscreen"></i>
        <i data-lte-icon="minimize" class="bi bi-fullscreen-exit d-none"></i>
      </button>
      <div class="dropdown">
        <button
          type="button"
          class="btn btn-sm btn-outline-secondary bg-body shadow-sm dropdown-toggle"
          data-bs-toggle="dropdown"
          aria-label="Ubah tema"
          title="Ubah tema"
        >
          <i class="bi bi-circle-half"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><button class="dropdown-item" type="button" data-bs-theme-value="light"><i class="bi bi-sun-fill me-2"></i>Terang</button></li>
          <li><button class="dropdown-item" type="button" data-bs-theme-value="dark"><i class="bi bi-moon-stars-fill me-2"></i>Gelap</button></li>
          <li><button class="dropdown-item" type="button" data-bs-theme-value="auto"><i class="bi bi-circle-half me-2"></i>Otomatis</button></li>
        </ul>
      </div>
    </div>

    <main class="login-box">
      <!-- Branding -->
      <div class="login-brand text-center mb-3">
        <div id="login-brand-logo" class="d-inline-block mb-2" style="width: 56px; height: 56px;"></div>
        <h1 id="login-brand-title" class="login-brand-name mb-0 fw-bold" aria-label="Dapur Laris Manis" style="min-height: 46px;"></h1>
        <p class="login-brand-tagline text-secondary mb-0">Laris Manis untuk yang Manis-Manis</p>
      </div>

      <!-- Card form -->
      <div class="card border-0 shadow-sm login-card">
        <div class="card-body px-4 py-4">
          <div id="login-error" class="alert alert-danger py-2 d-none" role="alert"></div>

          <form id="login-form" novalidate>
            <!-- Email -->
            <div class="form-floating mb-3">
              <input
                id="loginEmail"
                type="email"
                class="form-control"
                placeholder="nama@restoran.local"
                required
                autocomplete="username"
              />
              <label for="loginEmail"><i class="bi bi-envelope me-1"></i>Email Staf</label>
            </div>

            <!-- Password -->
            <div class="login-pass-wrap mb-4">
              <div class="form-floating">
                <input
                  id="loginPassword"
                  type="password"
                  class="form-control"
                  placeholder="Kata Sandi"
                  required
                  autocomplete="current-password"
                />
                <label for="loginPassword"><i class="bi bi-lock me-1"></i>Kata Sandi</label>
              </div>
              <button
                type="button"
                id="toggle-pass"
                class="login-pass-toggle"
                aria-label="Tampilkan atau sembunyikan kata sandi"
              >
                <span class="bi bi-eye"></span>
              </button>
            </div>

            <div class="d-grid">
              <button id="login-submit" type="submit" class="btn btn-primary btn-lg">
                <i class="bi bi-box-arrow-in-right me-1"></i> Masuk
              </button>
            </div>
          </form>

          <!-- Demo accounts — hanya tampil di mode lokal -->
          <div id="demo-accounts-box" class="mt-4 pt-3 border-top d-none">
            <p class="text-secondary small fw-semibold mb-2">
              <i class="bi bi-info-circle me-1"></i>Akun Uji Coba Mode Lokal (Klik untuk isi otomatis):
            </p>
            <div class="d-grid gap-2">
              <button type="button" class="btn btn-sm btn-outline-danger text-start text-break demo-fill" data-email="admin@restoran.local" data-pass="admin123">
                <span class="badge text-bg-danger me-1">Admin</span> admin@restoran.local / admin123
              </button>
              <button type="button" class="btn btn-sm btn-outline-primary text-start text-break demo-fill" data-email="kasir@restoran.local" data-pass="kasir123">
                <span class="badge text-bg-primary me-1">Kasir</span> kasir@restoran.local / kasir123
              </button>
              <button type="button" class="btn btn-sm btn-outline-warning text-start text-break demo-fill" data-email="chef@restoran.local" data-pass="chef123">
                <span class="badge text-bg-warning me-1">Chef</span> chef@restoran.local / chef123
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"
      crossorigin="anonymous"
    ></script>
    <script src="./js/adminlte.js"></script>
    <script type="module">
      import { renderAnimatedBrandLogo, renderAnimatedBrandTitle } from './js/brand-svg.js';
      import {
        bindFullscreenEnhancement,
        getRuntimeConfig,
        homePageForRole,
        isSoundEnabled,
        loginWithEmailPassword,
        playChime,
        registerServiceWorker,
        triggerMicroClass,
      } from './js/app-client.js';

      registerServiceWorker();
      bindFullscreenEnhancement();
      const logoEl = document.getElementById('login-brand-logo');
      const titleEl = document.getElementById('login-brand-title');
      if (!renderAnimatedBrandLogo(logoEl, { size: 56, loopPulse: false, interactive: true }) && logoEl) {
        logoEl.innerHTML = '<img src="./assets/img/app-icon.svg" width="56" height="56" alt="" class="login-brand-icon mb-0">';
      }
      if (!renderAnimatedBrandTitle(titleEl, { text: 'Dapur Laris Manis', fontSize: 27, width: 310, height: 46, delayMs: 40 }) && titleEl) {
        titleEl.textContent = 'Dapur Laris Manis';
      }

      const form = document.getElementById('login-form');
      const emailEl = document.getElementById('loginEmail');
      const passEl = document.getElementById('loginPassword');
      const errEl = document.getElementById('login-error');
      const submitBtn = document.getElementById('login-submit');
      const demoBox = document.getElementById('demo-accounts-box');

      document.getElementById('toggle-pass').addEventListener('click', (e) => {
        const isPass = passEl.type === 'password';
        passEl.type = isPass ? 'text' : 'password';
        const icon = e.currentTarget.querySelector('i');
        if (icon) icon.className = isPass ? 'bi bi-eye-slash' : 'bi bi-eye';
        triggerMicroClass(e.currentTarget, 'micro-pop', 220);
      });

      for (const btn of document.querySelectorAll('.demo-fill')) {
        btn.addEventListener('click', () => {
          emailEl.value = btn.dataset.email;
          passEl.value = btn.dataset.pass;
          errEl.classList.add('d-none');
        });
      }

      (async () => {
        try {
          const cfg = await getRuntimeConfig();
          if (cfg.mode !== 'firebase') {
            demoBox.classList.remove('d-none');
          }
        } catch {
          // Abaikan jika gagal mengambil konfigurasi awal
        }
      })();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errEl.classList.add('d-none');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Memproses...';
        try {
          const res = await loginWithEmailPassword(emailEl.value.trim(), passEl.value);
          const targetUrl = homePageForRole(res.user.role);
          try {
            sessionStorage.setItem('restoran_welcome_splash', '1');
          } catch {
            // Abaikan
          }
          if (isSoundEnabled()) {
            playChime('welcome_in');
          }

          const isFsActive = Boolean(
            document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement
          );
          if (isFsActive) {
            try {
              const [html, routerMod] = await Promise.all([
                fetch(targetUrl, { cache: 'default' }).then((r) => r.text()),
                import('./js/app-router.js'),
              ]);
              const doc = new DOMParser().parseFromString(html, 'text/html');
              for (const s of doc.body.querySelectorAll('script')) s.remove();
              document.title = doc.title || document.title;
              document.documentElement.classList.add('welcome-splash-active');
              document.body.className = doc.body.className;
              document.body.innerHTML = doc.body.innerHTML;
              history.replaceState(null, '', targetUrl);
              const routeCfg =
                res.user.role === 'chef'
                  ? { pageId: 'chef', allowedRoles: ['admin', 'kasir', 'chef'] }
                  : res.user.role === 'kasir'
                    ? { pageId: 'pesanan', allowedRoles: ['admin', 'kasir'] }
                    : { pageId: 'dashboard', allowedRoles: ['admin', 'kasir'] };
              await routerMod.initAppShell(routeCfg);
              return;
            } catch {
              // Fallback ke navigasi biasa jika gagal
            }
          }

          if (isSoundEnabled()) {
            await new Promise((r) => setTimeout(r, 450));
          }
          globalThis.location.href = targetUrl;
        } catch (err) {
          errEl.textContent = err.message || 'Gagal masuk.';
          errEl.classList.remove('d-none');
          triggerMicroClass(document.querySelector('.login-card'), 'micro-shake', 360);
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Masuk';
        }
      });
    </script>
  </body>
</html>
