<!doctype html>
<html lang="id">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>RestoOrder | Manajemen Meja</title>
    <script>
      (() => {
        'use strict';
        const root = document.documentElement;
        const stored = (() => {
          try { return localStorage.getItem('lte-theme'); } catch { return null; }
        })();
        const resolved = stored === 'dark' || stored === 'light'
          ? stored
          : (globalThis.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        root.setAttribute('data-bs-theme', resolved);
        root.style.colorScheme = resolved;
        try {
          const u = JSON.parse(localStorage.getItem('restoran_auth_user') || 'null');
          if (!u || !u.role) {
            root.classList.add('auth-pending');
            globalThis.location.replace('./login.html');
          } else if (u.role !== 'admin' && u.role !== 'kasir') {
            root.classList.add('auth-pending');
            globalThis.location.replace('./chef.html');
          }
        } catch {
          root.classList.add('auth-pending');
          globalThis.location.replace('./login.html');
        }
      })();
    </script>
    <style>html.auth-pending body{visibility:hidden}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <meta name="theme-color" content="#0d6efd" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/img/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/img/app-icon-192.png" />
    <link rel="preload" href="./css/adminlte.css" as="style" />

    <link

            <li class="nav-item d-none d-md-block">

          <ul class="navbar-nav ms-auto align-items-center gap-1 gap-sm-2">

            <img src="./assets/img/app-icon.svg" alt="Logo RestoOrder" class="brand-image opacity-90 shadow rounded" />

          </nav>
        </div>
      </aside>

      <main class="app-main">
        <div class="app-content-header">
          <div class="container-fluid">
            <div class="row align-items-center g-2">
              <div class="col-md-5 d-flex flex-wrap align-items-center gap-2">
                <h1 class="mb-0 fs-3"><i class="bi bi-grid-3x3-gap text-primary me-2"></i>Manajemen Meja</h1>
              </div>
              <div class="col-md-7 d-flex flex-wrap gap-1 justify-content-md-end align-items-center">
                <span class="badge text-bg-success">Tersedia: <span id="tbl-cnt-available">0</span></span>
                <span class="badge text-bg-primary">Terisi: <span id="tbl-cnt-occupied">0</span></span>
                <span class="badge text-bg-warning">Reserved: <span id="tbl-cnt-reserved">0</span></span>
                <span class="badge text-bg-secondary">Dibersihkan: <span id="tbl-cnt-cleaning">0</span></span>
                <button id="btn-add-table" type="button" class="btn btn-sm btn-primary ms-1 d-none">
                  <i class="bi bi-plus-lg me-1"></i> Tambah Meja
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="app-content">
          <div class="container-fluid">
            <div class="card mb-3">
              <div class="card-body p-2 d-flex flex-column flex-md-row gap-2 justify-content-between align-items-stretch align-items-md-center">
                <div id="table-area-tabs" class="d-flex flex-wrap gap-1">
                  <button type="button" class="btn btn-sm btn-primary table-area-btn" data-area="all">Semua Area</button>
                  <button type="button" class="btn btn-sm btn-outline-primary table-area-btn" data-area="Utama">Utama</button>
                  <button type="button" class="btn btn-sm btn-outline-primary table-area-btn" data-area="VIP">VIP</button>
                  <button type="button" class="btn btn-sm btn-outline-primary table-area-btn" data-area="Outdoor">Outdoor</button>
                </div>
                <div class="d-flex flex-wrap gap-1 align-items-center">
                  <select id="table-status-filter" class="form-select form-select-sm w-auto">
                    <option value="all">Semua Status</option>
                    <option value="available">Tersedia</option>
                    <option value="occupied">Terisi</option>
                    <option value="reserved">Reserved</option>
                    <option value="cleaning">Dibersihkan</option>
                  </select>
                  <input id="table-search" type="search" class="form-control form-control-sm w-auto" placeholder="Cari nomor meja..." style="min-width: 150px;" />
                </div>
              </div>
            </div>

            <div id="tables-grid" class="row g-2">
              <div class="col-12 text-center text-secondary py-4 small">Memuat daftar meja...</div>
            </div>
          </div>
        </div>
      </main>

      <footer class="app-footer">
        <div class="float-end d-none d-sm-inline">Manajemen Meja Real-Time</div>
        <strong>RestoOrder</strong> — Terhubung Otomatis dengan Pesanan &amp; Pembayaran.
      </footer>
    </div>

    <div id="app-page-modals">
      <div class="modal fade" id="tableModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <form id="table-form">
              <div class="modal-header py-2">
                <h5 class="modal-title fs-6 fw-bold" id="table-modal-title">Tambah Meja</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
              </div>
              <div class="modal-body">
                <input type="hidden" id="table-edit-id" />
                <div class="row g-2">
                  <div class="col-6">
                    <label for="table-number" class="form-label small fw-semibold mb-1">Nomor / Nama Meja</label>
                    <input id="table-number" type="text" class="form-control form-control-sm" placeholder="Contoh: 07 atau VIP-3" required />
                  </div>
                  <div class="col-6">
                    <label for="table-capacity" class="form-label small fw-semibold mb-1">Kapasitas (Kursi)</label>
                    <input id="table-capacity" type="number" min="1" max="50" value="4" class="form-control form-control-sm" required />
                  </div>
                  <div class="col-6">
                    <label for="table-area" class="form-label small fw-semibold mb-1">Area</label>
                    <select id="table-area" class="form-select form-select-sm">
                      <option value="Utama">Utama</option>
                      <option value="VIP">VIP</option>
                      <option value="Outdoor">Outdoor</option>
                    </select>
                  </div>
                  <div class="col-6">
                    <label for="table-status" class="form-label small fw-semibold mb-1">Status Awal</label>
                    <select id="table-status" class="form-select form-select-sm">
                      <option value="available">Tersedia</option>
                      <option value="reserved">Reserved</option>
                      <option value="cleaning">Dibersihkan</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label for="table-note" class="form-label small fw-semibold mb-1">Catatan (opsional)</label>
                    <input id="table-note" type="text" class="form-control form-control-sm" placeholder="Misal: Dekat jendela / Reservasi jam 19.00" />
                  </div>
                </div>
              </div>
              <div class="modal-footer py-2">
                <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
                <button type="submit" id="table-save-btn" class="btn btn-sm btn-primary">Simpan Meja</button>
              </div>
            </form>
          </div>
        </div>
